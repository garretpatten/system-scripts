---
name: 'Tests'

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: 'Jest'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Set up Node.js'
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'

      - name: 'Install dependencies'
        run: npm ci

      - name: 'Run tests'
        run: npm test

      - name: 'Type check'
        run: npm run typecheck
